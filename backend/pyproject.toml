[project]
name = "woodcarvo-backend"
version = "0.1.0"
description = "WOOD CARVO - Furniture Workshop Showcase & Inquiry Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15.0",
    "drf-spectacular>=0.27.0",
    "django-unfold>=0.40.0",
    "django-modeltranslation>=0.19.0",
    "dj-database-url>=2.2.0",
    "django-cors-headers>=4.4.0",
    "python-decouple>=3.8",
    "pillow>=10.4.0",
    "whitenoise>=6.7.0",
    "gunicorn>=23.0.0",
    "cloudinary>=1.41.0",
    "django-cloudinary-storage>=0.3.0",
    "psycopg[binary]>=3.2.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
